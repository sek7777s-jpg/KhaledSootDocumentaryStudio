name: Build Khaled Soot Documentary APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'KhaledSoot_DocumentaryStudio_v1_FIXED.zip'
      - '.github/workflows/build-documentary-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -o KhaledSoot_DocumentaryStudio_v1_FIXED.zip -d project

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
        working-directory: project/KhaledSootDocumentaryStudio

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KhaledSoot-Documentary-APK
          path: project/KhaledSootDocumentaryStudio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
